name: Backend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Build and verify
        run: ./mvnw -B clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build and start Compose
        run: docker compose up --build --wait --wait-timeout 60
      - name: Verify the published API
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/actuator/health |
            jq --exit-status '. == {"status":"UP"}'
          status=$(curl --silent --show-error --max-time 5 --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8080/actuator/env)
          test "$status" = 404
      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop Compose
        if: always()
        run: docker compose down
