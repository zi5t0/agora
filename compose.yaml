services:
  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:${AGORA_HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--timeout=3", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 20s
